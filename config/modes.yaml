modes:
  "1":
    interval_seconds: 30
    min_capacity: 1
    max_capacity: 5
    metrics:
      - name: response_time
        role: primary
        threshold_high: 500
        threshold_low: 200
    techniques: {}

  "2.1":
    interval_seconds: 30
    min_capacity: 1
    max_capacity: 5
    metrics:
      - name: cpu
        role: primary
        threshold_high: 70
        threshold_low: 30
    techniques:
      moving_average:
        window: 5
      autoregression:
        window: 3
      proportional_thresholding: 20

  "2.2":
    interval_seconds: 30
    min_capacity: 1
    max_capacity: 5
